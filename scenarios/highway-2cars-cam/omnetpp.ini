[General]
network = artery.inet.World

sim-time-limit = 100s  
user-interface = "Cmdenv" # to run in command line
cmdenv-express-mode = false
**.cmdenv-log-level = info
cmdenv-output-file = ".cmdenv-log"
cmdenv-redirect-output = true


*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.sumocfg = "highway.sumocfg"

*.node[*].middleware.updateInterval = 0.1s
*.node[*].middleware.datetime = "2018-03-19 10:00:00"
*.node[*].middleware.services = xmldoc("services.xml")

# Enabled the attack for node 1 (second car)
*.node[1].middleware.CA.isAttacker = true
*.node[1].middleware.CA.falsificationOffset = 50m

[Config sumo-gui]
*.traci.launcher.sumo = "sumo-gui"

 
